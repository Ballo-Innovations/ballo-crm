# One environment (dev, stage or prod) of BalloCRM on a Docker host fronted by Traefik.
# Lives on the host at /var/apps/ballocrm-<env>/deploy/, next to a .env made from
# deploy/.env.example. The Deploy workflow copies this file there on every deploy.
# Runbook: docs/07-dev-setup/environments-and-deployment.md
#
# Project name comes from COMPOSE_PROJECT_NAME in .env (ballocrm-dev, ballocrm-stage, ...),
# so each environment gets its own containers, network and volumes.
services:
  app:
    image: ghcr.io/ballo-innovations/ballo-crm:${IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    env_file: .env
    environment:
      RELEASE: ${IMAGE_TAG}
      DATABASE_URL: postgresql://ballocrm:${POSTGRES_PASSWORD}@db:5432/ballocrm
      NEXTAUTH_URL: https://${APP_HOST}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    networks: [internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_internal
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000
      # App: https://<APP_HOST>
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}
      # API: https://api.<APP_HOST>/v1/... -> the same app's /api/v1/...
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-api.addprefix.prefix=/api
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.rule=Host(`api.${APP_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.entrypoints=https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.middlewares=${COMPOSE_PROJECT_NAME}-api
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.service=${COMPOSE_PROJECT_NAME}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ballocrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ballocrm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ballocrm"], interval: 5s, retries: 10 }
    mem_limit: 512m
    networks: [internal]

  minio:
    # MinIO no longer publishes images on Docker Hub or Quay; Chainguard builds the same server.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes: [minio:/data]
    mem_limit: 256m
    networks: [internal]

  # One-off job: `docker compose run --rm migrate [command]`. Never started by `up`.
  migrate:
    profiles: ["tools"]
    image: ghcr.io/ballo-innovations/ballo-crm-migrate:${IMAGE_TAG}
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ballocrm:${POSTGRES_PASSWORD}@db:5432/ballocrm
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata: {}
  minio: {}
