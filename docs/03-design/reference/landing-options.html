<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landing Options</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --shell: #fff;
        --main: #ececec;
        --card: #fff;
        --ink: #0d0d0d;
        --inv: #fff;
        --mute: #6b6b6b;
        --soft: #f3f3f3;
        --line: #e4e4e4;
        --bar2: #d4d4d4;
        --danger: #dc2626;
        --chart-2: #7a7a7a;
        --chart-3: #c8c8c8;
      }
      :root[data-theme="dark"] {
        --shell: #111;
        --main: #1b1b1b;
        --card: #242424;
        --ink: #f5f5f5;
        --inv: #0d0d0d;
        --mute: #9a9a9a;
        --soft: #2e2e2e;
        --line: #3a3a3a;
        --bar2: #505050;
        --danger: #f87171;
        --chart-2: #9a9a9a;
        --chart-3: #505050;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--shell);
        color: var(--ink);
        font-family: Urbanist, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 32px 32px 80px;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .wrap {
        max-width: 1440px;
        margin: auto;
      }

      /* ---------- options chrome ---------- */
      .page-hd {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .page-hd h1 {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .page-hd p {
        color: var(--mute);
        margin-top: 4px;
        font-size: 15px;
      }
      .tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .seg {
        display: inline-flex;
        background: var(--soft);
        border-radius: 999px;
        padding: 4px;
        gap: 2px;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        color: var(--mute);
      }
      .seg button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--inv);
      }
      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .tab {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 999px;
        padding: 10px 16px 10px 10px;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        font-weight: 600;
        font-size: 15px;
      }
      .tab b {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: var(--soft);
        font-size: 13px;
      }
      .tab[aria-selected="true"] {
        background: var(--ink);
        color: var(--inv);
        border-color: var(--ink);
      }
      .tab[aria-selected="true"] b {
        background: var(--inv);
        color: var(--ink);
      }
      .stage {
        background: var(--main);
        border-radius: 28px;
        padding: 18px;
        display: flex;
        justify-content: center;
      }
      .frame {
        container-type: inline-size;
        width: 100%;
        height: 860px;
        border-radius: 18px;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
        background: var(--shell);
        box-shadow: 0 0 0 1px var(--line);
        transition: width 0.3s ease;
        scroll-behavior: smooth;
      }
      .frame.m {
        width: 390px;
        height: 800px;
      }
      .notes {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr;
        gap: 14px;
        margin-top: 18px;
      }
      .note {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 20px 22px;
      }
      .note h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mute);
        margin-bottom: 8px;
        font-weight: 700;
      }
      .note p,
      .note li {
        font-size: 15px;
        line-height: 1.55;
      }
      .note ul {
        padding-left: 18px;
      }
      .hint {
        color: var(--mute);
        font-size: 13px;
        margin-top: 12px;
      }
      @media (max-width: 900px) {
        body {
          padding: 16px;
        }
        .notes {
          grid-template-columns: 1fr;
        }
      }

      /* =========================================================
         Shared landing-page building blocks (inside .frame)
         ========================================================= */
      .lp {
        min-height: 100%;
        background: var(--shell);
        color: var(--ink);
      }
      .in {
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 32px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      .compass {
        width: 28px;
        height: 28px;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--shell) 86%, transparent);
        backdrop-filter: blur(12px);
      }
      .nav .in {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 76px;
        gap: 20px;
      }
      .links {
        display: flex;
        gap: 4px;
        background: var(--soft);
        border-radius: 999px;
        padding: 4px;
      }
      .links a {
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        color: var(--mute);
        cursor: pointer;
      }
      .links a:hover {
        color: var(--ink);
        background: var(--card);
      }
      .nav-r {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .burger {
        display: none;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: 0;
        background: var(--soft);
        place-items: center;
      }
      .mnav {
        display: none;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        border: 0;
        font-weight: 600;
        font-size: 15px;
        background: var(--ink);
        color: var(--inv);
        transition:
          transform 0.15s,
          opacity 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        opacity: 0.88;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.lg {
        height: 52px;
        padding: 0 26px;
        font-size: 16px;
      }
      .btn.ghost {
        background: var(--soft);
        color: var(--ink);
      }
      .btn.line {
        background: transparent;
        color: var(--ink);
        box-shadow: inset 0 0 0 1.5px var(--line);
      }
      .btn .arr {
        transition: transform 0.2s;
      }
      .btn:hover .arr {
        transform: translateX(3px);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 6px 6px;
        border-radius: 999px;
        background: var(--soft);
        font-size: 14px;
        font-weight: 600;
      }
      .chip b {
        background: var(--ink);
        color: var(--inv);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
      }
      .h-sec {
        font-size: clamp(32px, 4.2cqi, 52px);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }
      .h-sec .m {
        color: var(--mute);
      }
      .lead {
        color: var(--mute);
        font-size: 18px;
        line-height: 1.55;
        max-width: 560px;
      }
      .sec {
        padding: 96px 0;
      }
      .foot {
        padding: 40px 0 48px;
        color: var(--mute);
        font-size: 14px;
      }
      .foot .in {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .foot nav {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }
      .foot a:hover {
        color: var(--ink);
      }

      /* ---------- app pieces (match the kit) ---------- */
      .ic {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: var(--soft);
        display: grid;
        place-items: center;
        flex: none;
      }
      .ic.ink {
        background: var(--ink);
        color: var(--inv);
      }
      .kpi {
        background: var(--card);
        border-radius: 26px;
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .kpi .t {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--mute);
        font-weight: 600;
      }
      .kpi .v {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .kpi .d {
        font-size: 13px;
        color: var(--mute);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .kpi.ink {
        background: var(--ink);
        color: var(--inv);
      }
      .kpi.ink .t,
      .kpi.ink .d {
        color: color-mix(in srgb, var(--inv) 66%, transparent);
      }
      .kpi.ink .ic {
        background: color-mix(in srgb, var(--inv) 14%, transparent);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--soft);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .pill.ink {
        background: var(--ink);
        color: var(--inv);
      }
      .pill.risk {
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        color: var(--danger);
      }
      .grade {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px 0 4px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        background: var(--soft);
      }
      .grade i {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        display: block;
        border: 2px solid var(--ink);
      }
      .grade.platinum i {
        background: var(--ink);
      }
      .grade.gold i {
        background: linear-gradient(90deg, var(--ink) 50%, transparent 50%);
      }
      .grade.silver i {
        background: linear-gradient(90deg, var(--ink) 25%, transparent 25%);
      }
      .grade.bronze i {
        background: transparent;
      }
      .av {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: var(--soft);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        flex: none;
      }
      .av.ink {
        background: var(--ink);
        color: var(--inv);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 16px;
        transition: background 0.15s;
      }
      .row:hover {
        background: var(--soft);
      }
      .row .nm {
        font-weight: 700;
        font-size: 14px;
      }
      .row .sb {
        color: var(--mute);
        font-size: 12px;
      }
      .row .g {
        flex: 1;
        min-width: 0;
      }
      .row .amt {
        font-weight: 700;
        font-size: 14px;
      }
      .card {
        background: var(--card);
        border-radius: 28px;
        padding: 24px;
        min-width: 0;
      }
      .card h4 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .card .sub {
        color: var(--mute);
        font-size: 13px;
        margin-top: 2px;
      }
      .card-hd {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
        margin-bottom: 16px;
      }
      .bars {
        display: flex;
        align-items: end;
        gap: 10px;
        height: 150px;
      }
      .bars span {
        flex: 1;
        border-radius: 999px;
        background: var(--bar2);
        position: relative;
        transition: height 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .bars span.on {
        background: var(--ink);
      }
      .bars span {
        border-radius: 12px;
        max-width: 44px;
        margin: 0 auto;
      }
      .kpi.ink .bars span {
        background: color-mix(in srgb, var(--inv) 22%, transparent);
      }
      .kpi.ink .bars span.on {
        background: var(--inv);
      }
      .kpi.ink .bars span:hover::after {
        background: var(--inv);
        color: var(--ink);
      }
      .bars span:hover::after {
        content: attr(data-v);
        position: absolute;
        bottom: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--inv);
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .xl {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .xl span {
        flex: 1;
        text-align: center;
        font-size: 11px;
        color: var(--mute);
        font-weight: 600;
      }
      .insight {
        display: flex;
        gap: 12px;
        align-items: start;
        padding: 14px;
        border-radius: 18px;
        background: var(--soft);
        font-size: 14px;
        line-height: 1.45;
      }
      .insight b {
        font-weight: 700;
      }
      .insight .ic {
        width: 32px;
        height: 32px;
        background: var(--card);
      }
      .insight .ic svg {
        width: 16px;
        height: 16px;
      }

      /* mini app shell */
      .app {
        display: grid;
        grid-template-columns: 196px 1fr;
        background: var(--shell);
        border-radius: 26px;
        padding: 12px;
        gap: 12px;
        box-shadow:
          0 0 0 1px var(--line),
          0 40px 80px -40px rgb(0 0 0 / 0.35);
        text-align: left;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 6px;
      }
      .side .brand {
        font-size: 17px;
        margin: 0 8px 18px;
      }
      .side .brand .compass {
        width: 22px;
        height: 22px;
      }
      .side a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        color: var(--mute);
        cursor: pointer;
      }
      .side a svg {
        width: 16px;
        height: 16px;
      }
      .side a.on {
        background: var(--ink);
        color: var(--inv);
      }
      .side a:not(.on):hover {
        background: var(--soft);
        color: var(--ink);
      }
      .panel {
        background: var(--main);
        border-radius: 22px;
        padding: 20px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .panel-hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .panel-hd h5 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .panel-hd .sub {
        color: var(--mute);
        font-size: 13px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        background: var(--card);
        color: var(--mute);
        font-size: 13px;
        min-width: 180px;
      }
      .search kbd {
        margin-left: auto;
        font: inherit;
        font-size: 11px;
        background: var(--soft);
        padding: 2px 6px;
        border-radius: 6px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .kpis .kpi {
        padding: 16px 18px;
        gap: 10px;
        border-radius: 22px;
      }
      .kpis .kpi .v {
        font-size: 22px;
      }
      .kpis .ic {
        width: 32px;
        height: 32px;
      }
      .kpis .ic svg {
        width: 15px;
        height: 15px;
      }
      .split {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 12px;
      }
      .split .card {
        padding: 18px;
        border-radius: 22px;
      }
      .kan {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .col {
        background: var(--card);
        border-radius: 20px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .col-hd {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 6px;
      }
      .col-hd span {
        color: var(--mute);
      }
      .deal {
        background: var(--soft);
        border-radius: 14px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: grab;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .deal:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px -10px rgb(0 0 0 / 0.3);
      }
      .deal .nm {
        font-size: 13px;
        font-weight: 700;
      }
      .deal .ft {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
      }
      .deal .grade {
        height: 22px;
        font-size: 10px;
      }
      .deal .grade i {
        width: 14px;
        height: 14px;
      }

      /* score ring */
      .ring {
        position: relative;
        width: 148px;
        height: 148px;
        flex: none;
      }
      .ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .ring circle {
        transition: stroke-dasharray 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .ring .num {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        text-align: center;
      }
      .ring .num b {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .ring .num span {
        font-size: 11px;
        font-weight: 700;
        color: var(--mute);
        letter-spacing: 0.08em;
        margin-top: 4px;
      }
      .factor {
        display: grid;
        grid-template-columns: 110px 1fr 40px;
        gap: 10px;
        align-items: center;
        font-size: 13px;
      }
      .factor .tr {
        height: 8px;
        background: var(--soft);
        border-radius: 999px;
        overflow: hidden;
      }
      .factor .tr i {
        display: block;
        height: 100%;
        background: var(--ink);
        border-radius: 999px;
        transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .factor b {
        text-align: right;
      }
      .factor span {
        color: var(--mute);
        font-weight: 600;
      }

      /* reveal */
      .rv {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.6s,
          transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .rv.on {
        opacity: 1;
        transform: none;
      }

      /* ---------- wave backgrounds ---------- */
      .has-wave {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .has-wave > :not(.wave):not(.grid-bg):not(.nav) {
        position: relative;
        z-index: 1;
      }
      .has-wave > .wave {
        position: absolute;
      }
      .wave {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 100%;
        max-height: 1000px;
        z-index: 0;
        pointer-events: none;
        color: var(--ink);
      }
      .wave {
        -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 98%);
        mask-image: linear-gradient(to bottom, #000 55%, transparent 98%);
      }
      .wave.bottom {
        top: auto;
        bottom: 0;
        -webkit-mask-image: linear-gradient(to top, #000 55%, transparent 98%);
        mask-image: linear-gradient(to top, #000 55%, transparent 98%);
      }
      .wave svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .wave .drift {
        animation: drift var(--dur, 40s) linear infinite;
      }
      .wave .drift.rev {
        animation-direction: reverse;
      }
      .wave .bob {

          );
        }
        return `<svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g${tf}><g class="bob" style="--dur:16s">${lines.join("")}</g></g></svg>`;
      }
      // Where the waves go in each option: [selector, strength, flip, anchor to bottom]
      const WAVE_TARGETS = {
        A: [
          [".A .hero", 1, false],
          [".A .island", 1.6, true],
        ],
        B: [
          [".B .hero", 0.9, false],
          [".B .island", 1.6, false],
          ["#b-how", 0.7, true, true],
        ],
        C: [
          [".C .shell", 1, false],
          [".C .kpi.ink", 1.4, true],
        ],
        D: [
          [".D .hero", 1, false],
          [".D .island", 1.6, true],
        ],
        E: [
          [".E .hero", 1.5, false],
          ["#e-faq", 1, true, true],
        ],
        F: [
          [".F .D .hero", 1, false],
          [".F .island", 1.6, true],
        ],
      };
      function addWaves(f, id) {
        if (bgKind === "off") return;
        for (const [sel, str, flip, bottom] of WAVE_TARGETS[id]) {
          $$(sel, f).forEach((el) => {
            el.classList.add("has-wave");
            const w = document.createElement("div");
            w.className = "wave" + (bottom ? " bottom" : "");
            w.innerHTML = waveSvg(bgKind, str, flip);
            el.prepend(w);
          });
        }
      }

      /* ---------- behaviour ---------- */
      let current = "A";
      function renderTabs() {
        $("#tabs").innerHTML = OPTIONS.map(
          (o) =>
            `<button class="tab" role="tab" aria-selected="${o.id === current}" data-id="${o.id}"><b>${o.id}</b>${o.name}</button>`,
        ).join("");
      }
      function render() {
        const o = OPTIONS.find((x) => x.id === current);
        const f = $("#frame");
        f.innerHTML = o.render();
        addWaves(f, o.id);
        f.scrollTop = 0;
        $("#notes").innerHTML =
          `<div class="note"><h3>Option ${o.id} · ${o.name}</h3><p>${o.about}</p></div><div class="note"><h3>For</h3><ul>${o.pros.map((p) => `<li>${p}</li>`).join("")}</ul></div><div class="note"><h3>Against</h3><ul>${o.cons.map((p) => `<li>${p}</li>`).join("")}</ul></div>`;
        wire(f, o.id);
      }
      let io;
      function wire(f, id) {
        // reveal on scroll inside the frame
        io && io.disconnect();
        io = new IntersectionObserver(
          (es) => es.forEach((e) => e.isIntersecting && e.target.classList.add("on")),
          { root: f, threshold: 0.12 },
        );
        $$(".rv", f).forEach((el) => io.observe(el));
        // in-frame anchors
        f.addEventListener("click", onFrameClick);
        // mobile menu
        const bg = $(".burger", f);
        bg &&
          bg.addEventListener("click", () => {
            const m = $(".mnav", f);
            m.classList.toggle("open");
            bg.innerHTML = m.classList.contains("open") ? I.x : I.menu;
          });
        if (id === "A") wireA(f);
        if (id === "B") wireB(f);
        if (id === "C") wireC(f);
        if (id === "D") wireD(f);
        if (id === "F") wireF(f);
      }
      function onFrameClick(e) {
        const f = e.currentTarget;
        const go = e.target.closest("[data-go]");
        if (go) {
          e.preventDefault();
          const t = go.dataset.go === "top" ? f.firstElementChild : $("#" + go.dataset.go, f);
          if (t)
            f.scrollTo({
              top: t === f.firstElementChild ? 0 : t.offsetTop - 70,
              behavior: "smooth",
            });
          const m = $(".mnav.open", f);
          if (m) {
            m.classList.remove("open");
            $(".burger", f).innerHTML = I.menu;
          }
        }
        if (e.target.closest("[data-signin]") || e.target.closest('a[href="#"]'))
          e.preventDefault();
      }
      function wireA(f) {
        $(".tabsw", f).addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          $$(".tabsw button", f).forEach((x) => x.setAttribute("aria-pressed", x === b));
          $(".appslot", f).innerHTML = appWin(b.dataset.panel, PANELS[b.dataset.panel]());
        });
        $(".appslot", f).addEventListener("click", (e) => {
          const a = e.target.closest(".side a[data-mod]");
          if (!a || !PANELS[a.dataset.mod]) return;
          $$(".tabsw button", f).forEach((x) =>
            x.setAttribute("aria-pressed", x.dataset.panel === a.dataset.mod),
          );
          $(".appslot", f).innerHTML = appWin(a.dataset.mod, PANELS[a.dataset.mod]());
        });
      }
      function wireB(f) {
        $(".focus", f).addEventListener("click", (e) => {
          const r = e.target.closest(".row");
          if (!r) return;
          $$(".focus .row", f).forEach((x) =>
            x.classList.toggle("open", x === r && !x.classList.contains("open")),
          );
        });
        $(".goals", f).addEventListener("click", (e) => {
          const g = e.target.closest(".goal");
          g && g.classList.toggle("open");
        });
      }
      function wireC(f) {
        // Illustrative stage points; Negotiate matches the worked example (58 / GOLD).
        const S = {
          Qualify: [
            20,
            31,
            "BRONZE",
            "Early stage. Confirm budget and find a champion before investing more time.",
          ],
          Discover: [45, 41, "SILVER", "Map the buying committee: only 0.7 coverage so far."],
          Propose: [
            65,
            50,
            "SILVER",
            "Proposal out. Raise engagement with a site visit to cross into Gold.",
          ],
          Negotiate: [
            80,
            58,
            "GOLD",
            "Meet the economic buyer to lift committee coverage and move this deal toward Platinum.",
          ],
        };
        const C = 2 * Math.PI * 44;
        const set = (st) => {
          const [sp, sc, gr, why] = S[st];
          $(".fs", f).style.width = sp + "%";
          $(".fsv", f).textContent = sp;
          $(".sc", f).textContent = sc;
          $(".gr", f).textContent = gr;
          $(".why", f).textContent = why;
          $(".rg", f).setAttribute("stroke-dasharray", `${(sc / 100) * C} ${C}`);
        };
        set("Negotiate");
        $(".stagesw", f).addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          $$(".stagesw button", f).forEach((x) => x.setAttribute("aria-pressed", x === b));
          set(b.dataset.stage);
        });
      }
      // The ⌘K palette (D and F). jumpTo gets the module to show: Accounts, Pipeline, Intelligence or Dashboard.
      function wirePalette(f, jumpTo, items) {
        const ITEMS = items || [
          ["Accounts", "Kariba Power Co.", "Energy · Platinum deal", "acc"],
          ["Accounts", "Mutual Bank of Lusaka", "Banking · renews Mar 2027", "acc"],
          ["Accounts", "Zedcell Networks", "Telecoms · renewal in 90 days", "acc"],
          ["Accounts", "Kafue Valley Foods", "Agriculture · cross-sell ready", "acc"],
          ["Pages", "Forecast", "Weighted pipeline by vertical", "fc"],
          ["Pages", "Pipeline", "Kanban of open deals", "pipe"],
          ["Pages", "Contracts: renewals", "Due in the next 90 days", "con"],
          ["Ask Brutus", "Which deals need attention this week?", "Uses your focus list", "intel"],
        ];
        const inp = $(".cmd input", f);
        const list = $(".cmd-list", f);
        let sel = 0,
          shown = ITEMS;
        const draw = () => {
          const q = inp.value.trim().toLowerCase();
          shown = ITEMS.filter((x) => !q || (x[1] + x[2] + x[0]).toLowerCase().includes(q));
          if (!shown.length) shown = ITEMS.filter((x) => x[3] === "intel").slice(0, 1);
          sel = Math.min(sel, shown.length - 1);
          let g = "";
          list.innerHTML = shown
            .map((x, i) => {
              const h = x[0] !== g ? `<div class="cmd-grp">${x[0]}</div>` : "";
              g = x[0];
              return `${h}<div class="row ${i === sel ? "sel" : ""}" data-i="${i}"><span class="ic">${I[x[3]]}</span><div class="g"><div class="nm">${x[1]}</div><div class="sb">${x[2]}</div></div><span class="sb">↵</span></div>`;
            })
            .join("");
        };
        inp.addEventListener("input", () => {
          sel = 0;
          draw();
        });
        inp.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown") ((sel = (sel + 1) % shown.length), draw(), e.preventDefault());
          if (e.key === "ArrowUp")
            ((sel = (sel - 1 + shown.length) % shown.length), draw(), e.preventDefault());
          if (e.key === "Enter") jump(shown[sel]);
        });
        list.addEventListener("mousemove", (e) => {
          const r = e.target.closest(".row");
          if (r && +r.dataset.i !== sel) ((sel = +r.dataset.i), draw());
        });
        list.addEventListener("click", (e) => {
          const r = e.target.closest(".row");
          r && jump(shown[+r.dataset.i]);
        });
        const jump = (x) =>
          jumpTo(
            x[3] === "acc"
              ? "Accounts"
              : x[3] === "pipe"
                ? "Pipeline"
                : x[3] === "intel"
                  ? "Intelligence"
                  : "Dashboard",
            x,
          );
        draw();
      }
      function wireF(f) {
        wireA(f);
        const ANSWERS = {
          next: "Work <b>Kariba Power Co.</b> first: Platinum, K 5.8M in Negotiate, and legal review is booked for Thursday, so send the redline today. Then <b>Mutual Bank of Lusaka</b>: it scores 58 (Gold), and meeting the economic buyer is the fastest way to lift it.",
          story:
            "<b>Mutual Bank of Lusaka</b> is a key banking account with K 7.4M under contract, renewing in March 2027. It has 3 open deals worth K 4.1M; the largest is in Negotiate at 58 (Gold). Committee coverage is 0.7, with no meeting yet with the economic buyer. Best cross-sell: SD-WAN.",
          risk: "<b>Zedcell Networks</b> renews in 90 days and engagement has dropped. Book the quarterly review this week. <b>Mwezi Fibre</b> has no champion yet: invite the CTO to the fibre briefing.",
        };
        const askItems = [
          [
            "Ask Brutus",
            "Which deal should I work next?",
            "Ranked from your focus list",
            "intel",
            "next",
          ],
          [
            "Ask Brutus",
            "Give me the whole story on Mutual Bank of Lusaka",
            "Contracts, deals, committee and cross-sell",
            "intel",
            "story",
          ],
          [
            "Ask Brutus",
            "Which accounts are at risk this month?",
            "Health, renewals and engagement",
            "intel",
            "risk",
          ],
          ["Accounts", "Kariba Power Co.", "Energy · Platinum deal", "acc"],
          ["Accounts", "Mutual Bank of Lusaka", "Banking · renews Mar 2027", "acc"],
          ["Accounts", "Zedcell Networks", "Telecoms · renewal in 90 days", "acc"],
          ["Pages", "Pipeline", "Kanban of open deals", "pipe"],
          ["Pages", "Forecast", "Weighted pipeline by vertical", "fc"],
        ];
        const ans = $(".f-answer", f);
        const answer = (item) => {
          const q = $(".cmd input", f);
          ans.innerHTML = `<div class="f-q">${item[1]}</div><div class="insight"><span class="ic">${I.intel}</span><span class="f-typed"></span></div><div class="f-src">Built from the rules and your data. Brutus adds no numbers of its own.</div>`;
          ans.hidden = false;
          $(".cmd-list", f).hidden = true;
          $(".cmd-in input", f).value = "";
          // type the answer out, word by word
          const words = ANSWERS[item[4]].split(" ");
          const out = $(".f-typed", ans);
          let n = 0;
          clearInterval(ans._t);
          ans._t = setInterval(() => {
            n++;
            out.innerHTML = words.slice(0, n).join(" ");
            if (n >= words.length) clearInterval(ans._t);
          }, 35);
          q.blur();
        };
        // Typing or focusing the box brings the suggestions back.
        const reopen = () => ($(".cmd-list", f).hidden = false);
        $(".cmd-in input", f).addEventListener("focus", reopen);
        $(".cmd-in input", f).addEventListener("input", reopen);
        wirePalette(
          f,
          (t, item) => {
            if (t === "Intelligence") return answer(item);
            const p = PANELS[t] ? t : "Dashboard";
            $$(".tabsw button", f).forEach((x) =>
              x.setAttribute("aria-pressed", x.dataset.panel === p),
            );
            let html = appWin(p, PANELS[p]());
            // Show the account that was picked, not always the sample one.
            if (p === "Accounts")
              html = html.replace(
                '<h5>Mutual Bank of Lusaka</h5><div class="sub">Banking · Key account',
                `<h5>${item[1]}</h5><div class="sub">${item[2]}`,
              );
            $(".appslot", f).innerHTML = html;
            f.scrollTo({ top: $("#a-prod", f).offsetTop - 70, behavior: "smooth" });
          },
          askItems,
        );
      }
      function wireD(f) {
        wirePalette(f, (t) => {
          showTour(t);
          f.scrollTo({ top: $("#d-tour", f).offsetTop - 70, behavior: "smooth" });
        });
        const VIEWS = {
          Dashboard: () =>
            dashPanel().replace('class="panel"', 'class="panel" style="padding:0;background:none"'),
          Pipeline: () =>
            pipePanel().replace('class="panel"', 'class="panel" style="padding:0;background:none"'),
          Accounts: () =>
            accPanel().replace('class="panel"', 'class="panel" style="padding:0;background:none"'),
          Intelligence:
            () => `<div class="panel" style="padding:0;background:none"><div class="panel-hd"><div><h5>Intelligence</h5><div class="sub">Rules decide, Brutus explains</div></div><span class="pill ink">${I.intel}Brutus</span></div>
            <div class="acc"><div class="card"><div class="card-hd"><div><h4>Next best actions</h4><div class="sub">This week</div></div></div>
            ${[
              ["Kariba Power Co.", "Send the legal redline before Thursday."],
              ["Mutual Bank of Lusaka", "Meet the economic buyer, Natasha Mwale."],
              ["Mwezi Fibre", "Find a champion: invite the CTO to the fibre briefing."],
            ]
              .map(
                ([n, a]) =>
                  `<div class="row"><span class="ic">${I.target}</span><div class="g"><div class="nm">${n}</div><div class="sb">${a}</div></div></div>`,
              )
              .join("")}</div>
            <div class="card"><div class="card-hd"><div><h4>Cross-sell</h4><div class="sub">From the recommender</div></div></div><div style="display:flex;flex-direction:column;gap:8px">
            <div class="insight"><span class="ic">${I.intel}</span><span><b>SD-WAN for Mutual Bank of Lusaka.</b> Bought by 3 of 4 similar banks after managed security.</span></div>
            <div class="insight"><span class="ic">${I.intel}</span><span><b>Cloud backup for Kafue Valley Foods.</b> Fits their 14-site rollout.</span></div></div></div></div></div>`,
        };
        const showTour = (t) => {
          $$(".tour-nav button", f).forEach((x) =>
            x.setAttribute("aria-pressed", x.dataset.tour === t),
          );
          $(".tour-view", f).innerHTML = `<div>${VIEWS[t]()}</div>`;
        };
        $(".tour-nav", f).addEventListener("click", (e) => {
          const b = e.target.closest("button");
          b && showTour(b.dataset.tour);
        });
        showTour("Dashboard");
      }

      $("#tabs").addEventListener("click", (e) => {
        const b = e.target.closest(".tab");
        if (!b) return;
        current = b.dataset.id;
        renderTabs();
        render();
      });
      $("#vp").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        [...$("#vp").children].forEach((x) => x.setAttribute("aria-pressed", x === b));
        $("#frame").classList.toggle("m", b.dataset.v === "m");
      });
      $("#bg").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        [...$("#bg").children].forEach((x) => x.setAttribute("aria-pressed", x === b));
        bgKind = b.dataset.b;
        const top = $("#frame").scrollTop;
        render();
        $("#frame").scrollTop = top;
      });
      $("#th").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        [...$("#th").children].forEach((x) => x.setAttribute("aria-pressed", x === b));
        document.documentElement.dataset.theme = b.dataset.t;
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input")) return;
        const i = "ABCDEF".indexOf(e.key.toUpperCase());
        if (i >= 0 && !e.metaKey && !e.ctrlKey) {
          current = "ABCDEF"[i];
          renderTabs();
          render();
        }
      });
      renderTabs();
      render();
    </script>
  </body>
</html>
