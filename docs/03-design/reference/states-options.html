<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>State Options</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --shell: #fff;
        --main: #ececec;
        --card: #fff;
        --ink: #0d0d0d;
        --mute: #6b6b6b;
        --soft: #f3f3f3;
        --line: #e4e4e4;
        --bar2: #d4d4d4;
        --danger: #dc2626;
      }
      :root[data-theme="dark"] {
        --shell: #111;
        --main: #1b1b1b;
        --card: #242424;
        --ink: #f5f5f5;
        --mute: #9a9a9a;
        --soft: #2e2e2e;
        --line: #3a3a3a;
        --bar2: #505050;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--shell);
        color: var(--ink);
        font-family: Urbanist, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 40px 32px 80px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .wrap {
        max-width: 1360px;
        margin: auto;
      }
      .page-hd {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .page-hd h1 {
        font-size: 30px;
        font-weight: 700;
      }
      .page-hd p {
        color: var(--mute);
        margin-top: 6px;
        font-size: 15px;
        max-width: 720px;
        line-height: 1.5;
      }
      .seg {
        display: inline-flex;
        background: var(--soft);
        border-radius: 30px;
        padding: 4px;
        gap: 2px;
        flex-wrap: wrap;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 8px 14px;
        border-radius: 24px;
        font-size: 13px;
        font-weight: 600;
      }
      .seg button.on {
        background: var(--ink);
        color: var(--shell);
      }
      .opt {
        margin-bottom: 44px;
      }
      .opt-hd {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
        flex-wrap: wrap;
      }
      .badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--shell);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        flex: none;
      }
      .opt-hd h2 {
        font-size: 22px;
        font-weight: 600;
      }
      .opt-desc {
        color: var(--mute);
        font-size: 15px;
        margin: 0 0 14px 48px;
        line-height: 1.5;
        max-width: 880px;
      }
      .ctrl {
        margin: 0 0 14px 48px;
      }

      /* app frame */
      .app {
        background: var(--main);
        border-radius: 28px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 520px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .kpi {
        background: var(--card);
        border-radius: 22px;
        padding: 16px;
        text-align: center;
        min-height: 120px;
      }
      .kpi .ci {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--soft);
        display: grid;
        place-items: center;
        margin: 0 auto 10px;
      }
      .kpi b {
        display: block;
        font-size: 22px;
      }
      .kpi span {
        font-size: 12px;
        color: var(--mute);
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .hd h3 {
        font-size: 20px;
        font-weight: 600;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--soft);
        border-radius: 999px;
        height: 38px;
        padding: 0 14px;
        color: var(--mute);
        font-size: 14px;
        min-width: 200px;
      }
      .search input {
        border: 0;
        background: none;
        outline: none;
        font: inherit;
        color: var(--ink);
        flex: 1;
        min-width: 0;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .r {
        display: grid;
        grid-template-columns: 40px 1.4fr 1fr 110px 100px;
        gap: 12px;
        align-items: center;
        background: var(--soft);
        border-radius: 16px;
        padding: 10px 14px;
        font-size: 14px;
        animation: fade 0.3s;
      }
      .r .av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--card);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 12px;
      }
      .r b {
        font-weight: 600;
      }
      .r .m {
        color: var(--mute);
      }
      .pill {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 20px;
        padding: 4px 11px;
        font-size: 12px;
        justify-self: start;
      }
      .b {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1.5px solid transparent;
        border-radius: 999px;
        height: 44px;
        padding: 0 20px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        transition:
          opacity 0.15s,
          background 0.15s;
      }
      .b.sm {
        height: 36px;
        padding: 0 14px;
        font-size: 13px;
      }
      .b.pri {
        background: var(--ink);
        color: var(--shell);
      }
      .b.pri:hover {
        opacity: 0.85;
      }
      .b.sec {
        border-color: var(--ink);
        background: none;
      }
      .b.sec:hover {
        background: var(--soft);
      }
      .b.gho {
        background: none;
      }
      .b.gho:hover {
        background: var(--soft);
      }
      .b.hero {
        padding-left: 5px;
      }
      .b.hero .circ {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--shell);
        color: var(--ink);
        display: grid;
        place-items: center;
      }
      .b.sm.hero {
        padding-left: 4px;
      }
      .b.sm.hero .circ {
        width: 28px;
        height: 28px;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      /* skeleton */
      .sk {
        background: var(--soft);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
      }
      .kpi .sk,
      .r .sk {
        background: var(--line);
      }
      .shimmer .sk::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in srgb, var(--card) 70%, transparent),
          transparent
        );
        animation: sh 1.3s infinite;
      }
      .pulse .sk {
        animation: pl 1.4s ease-in-out infinite;
      }
      @keyframes sh {
        to {
          transform: translateX(100%);
        }
      }
      @keyframes pl {
        50% {
          opacity: 0.45;
        }
      }

      /* centred states */
      .center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px 16px;
        animation: fade 0.3s;
      }
      .center .ec {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--soft);
        display: grid;
        place-items: center;
        margin-bottom: 14px;
      }
      .center .ec svg {
        width: 22px;
        height: 22px;
      }
      .center .ec.err {
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        color: var(--danger);
      }
      .center h4 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .center p {
        color: var(--mute);
        font-size: 14px;
        max-width: 360px;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .center .acts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .center code {
        font-size: 12px;
        color: var(--mute);
        margin-top: 12px;
      }

      /* B illustration */
      .ill {
        position: relative;
        width: 180px;
        height: 110px;
        margin-bottom: 18px;
      }
      .ill i {
        position: absolute;
        left: 20px;
        right: 20px;
        height: 30px;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
      }
      .ill i::before {
        content: "";
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--soft);
      }
      .ill i::after {
        content: "";
        height: 6px;
        border-radius: 4px;
        background: var(--soft);
        flex: 1;
      }
      .ill i:nth-child(1) {
        top: 0;
        transform: scale(0.86);
        opacity: 0.5;
      }
      .ill i:nth-child(2) {
        top: 22px;
        transform: scale(0.93);
        opacity: 0.8;
      }
      .ill i:nth-child(3) {
        top: 46px;
      }
      .ill .plus {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--shell);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
      }
      .ill.err i:nth-child(3) {
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      }
      .ill.err .plus {
        background: var(--danger);
        color: #fff;
      }
      .ill.search .plus {
        background: var(--card);
        color: var(--ink);
        border: 1.5px solid var(--ink);
      }

      /* C ghost/inline */
      .ghost {
        position: relative;
      }
      .ghost .rows {
        opacity: 0.38;
        filter: grayscale(1);
        pointer-events: none;
        -webkit-mask-image: linear-gradient(#000 30%, transparent);
        mask-image: linear-gradient(#000 30%, transparent);
      }
      .ghost .over {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      .ghost .over .in {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--card);
        border-radius: 28px;
        padding: 14px 24px;
        box-shadow: 0 0 44px 36px var(--card);
      }
      .ghost .over h4 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .ghost .over p {
        color: var(--mute);
        font-size: 14px;
        margin-bottom: 14px;
        max-width: 360px;
      }
      .opt[data-o="D"] .ghost .rows {
        filter: grayscale(1) blur(5px);
        opacity: 0.55;
      }
      .opt[data-o="D"] .ex {
        display: none;
      }
      .ex {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mute);
        margin-bottom: 8px;
      }
      .banner {
        display: flex;
        align-items: center;
        gap: 10px;
        background: color-mix(in srgb, var(--danger) 9%, var(--card));
        border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
        color: var(--ink);
        border-radius: 16px;
        padding: 10px 12px;
        font-size: 14px;
        margin-bottom: 10px;
        animation: fade 0.3s;
      }
      .banner .bi {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--danger);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .banner > span:not(.bi) {
        flex: 1;
      }
      .banner .bi {
        flex: none;
      }
      .banner small {
        color: var(--mute);
      }
      .stale .rows {
        opacity: 0.55;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--ink);
        color: var(--shell);
        border-radius: 999px;
        padding: 5px 8px 5px 12px;
        font-size: 12px;
        font-weight: 600;
      }
      .chip button {
        border: 0;
        background: color-mix(in srgb, var(--shell) 20%, transparent);
        color: var(--shell);
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .chip svg {
        width: 10px;
        height: 10px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 120px);
        opacity: 0;
        background: var(--ink);
        color: var(--shell);
        padding: 8px 16px 8px 8px;
        border-radius: 999px;
        font-size: 14px;
        display: flex;
        gap: 10px;
        align-items: center;
        transition: all 0.3s;
        z-index: 50;
      }
      .toast i {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--shell);
        color: var(--ink);
        display: grid;
        place-items: center;
      }
      .toast.on {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      @media (max-width: 900px) {
        body {
          padding: 20px 12px 60px;
        }
        .opt-desc,
        .ctrl {
          margin-left: 0;
        }
        .kpis {
          grid-template-columns: 1fr 1fr;
        }
        .r {
          grid-template-columns: 36px 1fr 90px;
        }
        .r > :nth-child(3),
        .r > :nth-child(5) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="page-hd">
        <div>
          <h1>Empty, loading &amp; error — 4 options</h1>
          <p>
            The same Leads page in each state. Use the switch above each option, or the buttons
            inside: <b>Retry</b> reloads, <b>Add lead</b> adds one, <b>Clear search</b> resets.
            Every list and page in the app needs all of these.
          </p>
        </div>
        <div class="seg" id="thm">
          <button class="on" data-v="light">Light</button><button data-v="dark">Dark</button>
        </div>
      </div>
      <div id="opts"></div>
    </div>
    <div class="toast" id="toast"><i></i><span></span></div>
    <script>
      var P = {
        plus: '<path d="M12 5v14M5 12h14"/>',
        users:
          '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.6 3 5.2"/>',
        err: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
        up: '<path d="M12 15V4M7 9l5-5 5 5M5 20h14"/>',
        x: '<path d="M6 6l12 12M18 6L6 18"/>',
        retry: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/>',
        target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
        k: "",
        check: '<path d="M4 12l5 5L20 6"/>',
      };
      function ic(k) {
        return (
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
          P[k] +
          "</svg>"
        );
      }
      var seed = [
        ["Kafue Valley Foods", "Mwila Banda", "Referral", "K1.2M"],
        ["Copperline Power", "Chanda Phiri", "Event", "K3.4M"],
        ["Kalulu Retail", "Joseph Tembo", "Website", "K0.8M"],
        ["Mulungushi Town Trust", "Grace Mulenga", "Partner", "K2.1M"],
        ["Zambezi Ridge Traders", "Peter Zulu", "Cold outreach", "K0.6M"],
      ];
      var D = {
        A: [
          "Minimal",
          "Soft grey skeletons that shimmer, then quiet centred messages: icon circle, one line, one hero button. Errors replace the list with a Retry.",
          "shimmer",
        ],
        B: [
          "Illustrated",
          'Same idea with a small monochrome illustration built from our own card shapes, a title, a helpful line and two buttons. Skeletons pulse instead of shimmer. Friendlier, more "designed".',
          "pulse",
        ],
        D: [
          "Inline &amp; ghost, blurred",
          "Empty uses C with the example rows blurred into soft shapes (no readable text). No results and error use the illustrated style from B.",
          "shimmer",
        ],
        C: [
          "Inline &amp; ghost",
          "The page never goes blank. Empty shows faded example rows behind the call to action, so people see what will appear. Errors show a red banner above the last data you had instead of wiping it.",
          "shimmer",
        ],
      };
      var S = {};
      function ini(n) {
        var w = n.split(" ");
        return (w[0][0] + (w[1] ? w[1][0] : "")).toUpperCase();
      }
      function row(r) {
        return (
          '<div class="r"><span class="av">' +
          ini(r[0]) +
          "</span><b>" +
          r[0] +
          '</b><span class="m">' +
          r[1] +
          '</span><span class="pill">' +
          r[2] +
          "</span><b>" +
          r[3] +
          "</b></div>"
        );
      }
      function kpis(st, o) {
        if (st === "loading")
          return (
            '<div class="kpis">' +
            [1, 2, 3, 4]
              .map(function () {
                return '<div class="kpi"><div class="sk" style="width:38px;height:38px;border-radius:50%;margin:0 auto 10px"></div><div class="sk" style="width:50%;height:20px;margin:0 auto 8px"></div><div class="sk" style="width:70%;height:10px;margin:0 auto"></div></div>';
              })
              .join("") +
            "</div>"
          );
        var n = S[o].rows.length || (st === "error" && (o === "C" || o === "D") ? seed.length : 0),
          em = n === 0 && st !== "error";
        var v = em ? ["0", "K0", "—", "—"] : [n, "K" + (n * 1.6).toFixed(1) + "M", "32%", "4 days"];
        if (st === "error" && o !== "C") v = ["—", "—", "—", "—"];
        var L = ["Open leads", "Pipeline value", "Conversion", "Avg. response"],
          I = ["target", "up", "check", "retry"];
        return (
          '<div class="kpis">' +
          v
            .map(function (x, i) {
              return (
                '<div class="kpi"><div class="ci">' +
                ic(I[i]) +
                "</div><b>" +
                x +
                "</b><span>" +
                L[i] +
                "</span></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }
      function hd(o, st) {
        var q = st === "nores" ? "Kafue Gorge" : "";
        return (
          '<div class="hd"><h3>Leads</h3><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="search">' +
          ic("search") +
          '<input data-q value="' +
          q +
          '" placeholder="Search leads"></label>' +
          (st !== "loading"
            ? '<button class="b sm pri hero" data-a="add"><span class="circ">' +
              ic("plus") +
              "</span>Add lead</button>"
            : "") +
          "</div></div>"
        );
      }
      function body(o, st) {
        var fx = D[o][2];
        if (st === "loading")
          return (
            '<div class="rows ' +
            fx +
            '">' +
            [1, 2, 3, 4, 5]
              .map(function () {
                return '<div class="r"><div class="sk" style="width:34px;height:34px;border-radius:50%"></div><div class="sk" style="height:12px;width:80%"></div><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:22px;width:80px;border-radius:20px"></div><div class="sk" style="height:12px;width:50px"></div></div>';
              })
              .join("") +
            "</div>"
          );
        if (st === "loaded") return '<div class="rows">' + S[o].rows.map(row).join("") + "</div>";
        var add =
            '<button class="b pri hero" data-a="add"><span class="circ">' +
            ic("plus") +
            "</span>Add lead</button>",
          imp = '<button class="b sec" data-a="import">' + ic("up") + "Import CSV</button>",
          retry = '<button class="b pri" data-a="retry">' + ic("retry") + "Retry</button>",
          clear = '<button class="b sec" data-a="clear">' + ic("x") + "Clear search</button>";
        var C = {
          empty: [
            "users",
            "No leads yet",
            "Leads are new prospects before they become opportunities. Add your first one or import a list.",
            o === "A" ? add : add + imp,
          ],
          nores: [
            "search",
            "No leads match “Kafue Gorge”",
            "Check the spelling or try a company or contact name.",
            clear,
          ],
          error: [
            "err",
            "Couldn’t load leads",
            "The server didn’t respond. Your data is safe — try again in a moment.",
            retry +
              (o === "B" || o === "D"
                ? '<button class="b gho" data-a="toast">Contact support</button>'
                : ""),
          ],
        }[st];
        if (o === "A")
          return (
            '<div class="center"><div class="ec' +
            (st === "error" ? " err" : "") +
            '">' +
            ic(C[0]) +
            "</div><h4>" +
            C[1] +
            "</h4><p>" +
            C[2] +
            '</p><div class="acts">' +
            C[3] +
            "</div>" +
            (st === "error" ? "<code>Error ref: LDS-504 · 19:42</code>" : "") +
            "</div>"
          );
        if (o === "B" || (o === "D" && st !== "empty"))
          return (
            '<div class="center"><div class="ill' +
            (st === "error" ? " err" : st === "nores" ? " search" : "") +
            '"><i></i><i></i><i></i><span class="plus">' +
            ic(st === "error" ? "err" : st === "nores" ? "search" : "plus") +
            "</span></div><h4>" +
            C[1] +
            "</h4><p>" +
            C[2] +
            '</p><div class="acts">' +
            C[3] +
            "</div></div>"
          );
        // C
        if (st === "error")
          return (
            '<div class="banner"><span class="bi">' +
            ic("err") +
            '</span><span><b>Couldn’t refresh leads.</b> <small>Showing data from 19:38.</small></span><button class="b sm pri" data-a="retry">' +
            ic("retry") +
            'Retry</button></div><div class="stale"><div class="rows">' +
            (S[o].rows.length ? S[o].rows : seed).map(row).join("") +
            "</div></div>"
          );
        if (st === "nores")
          return (
            '<div style="margin-bottom:12px"><span class="chip">Search: Kafue Gorge<button data-a="clear" aria-label="Clear search">' +
            ic("x") +
            '</button></span></div><div class="ghost" style="flex:1"><div class="rows">' +
            seed.slice(0, 3).map(row).join("") +
            '</div><div class="over"><div class="in"><h4>No leads match</h4><p>Nothing found for “Kafue Gorge”. Try a company or contact name.</p>' +
            clear +
            "</div></div></div>"
          );
        return (
          '<div class="ghost" style="flex:1"><div class="ex">Example</div><div class="rows">' +
          seed.slice(0, 4).map(row).join("") +
          '</div><div class="over"><div class="in"><h4>Your leads will appear here</h4><p>Add a lead or import a list to start your pipeline.</p><div class="acts" style="display:flex;gap:10px">' +
          add +
          imp +
          "</div></div></div></div>"
        );
      }
      function render(o) {
        var st = S[o].st;
        var el = document.querySelector('.opt[data-o="' + o + '"] .app');
        el.innerHTML =
          kpis(st, o) +
          '<div class="card ' +
          (st === "loading" ? D[o][2] : "") +
          '">' +
          hd(o, st) +
          body(o, st) +
          "</div>";
        document.querySelectorAll('.opt[data-o="' + o + '"] .ctrl button').forEach(function (b) {
          b.classList.toggle("on", b.dataset.s === st);
        });
      }
      var h = "";
      ["A", "B", "C", "D"].forEach(function (o) {
        S[o] = { st: "empty", rows: [] };
        h +=
          '<section class="opt" data-o="' +
          o +
          '"><div class="opt-hd"><div class="badge">' +
          o +
          "</div><h2>" +
          D[o][0] +
          '</h2></div><p class="opt-desc">' +
          D[o][1] +
          '</p><div class="ctrl"><div class="seg">' +
          ["loaded", "loading", "empty", "nores", "error"]
            .map(function (s) {
              return (
                '<button data-s="' +
                s +
                '">' +
                {
                  loaded: "Loaded",
                  loading: "Loading",
                  empty: "Empty",
                  nores: "No results",
                  error: "Error",
                }[s] +
                "</button>"
              );
            })
            .join("") +
          '</div></div><div class="app"></div></section>';
      });
      document.getElementById("opts").innerHTML = h;
      ["A", "B", "C", "D"].forEach(render);
      function toast(m) {
        var t = document.getElementById("toast");
        t.querySelector("i").innerHTML = ic("check");
        t.querySelector("span").textContent = m;
        t.classList.add("on");
        clearTimeout(t._t);
        t._t = setTimeout(function () {
          t.classList.remove("on");
        }, 2200);
      }
      function load(o, then) {
        S[o].st = "loading";
        render(o);
        setTimeout(function () {
          S[o].st = then || (S[o].rows.length ? "loaded" : "empty");
          render(o);
        }, 1300);
      }
      document.addEventListener("click", function (e) {
        var op = e.target.closest(".opt");
        if (!op) return;
        var o = op.dataset.o;
        var s = e.target.closest(".ctrl button");
        if (s) {
          var v = s.dataset.s;
          if (v === "loaded" && !S[o].rows.length) S[o].rows = seed.slice();
          S[o].st = v;
          render(o);
          return;
        }
        var a = e.target.closest("[data-a]");
        if (!a) return;
        a = a.dataset.a;
        if (a === "retry") (load(o, "loaded"), S[o].rows.length || (S[o].rows = seed.slice()));
        if (a === "add") {
          S[o].rows.unshift(seed[S[o].rows.length % seed.length].slice());
          S[o].st = "loaded";
          render(o);
          toast("Lead added");
        }
        if (a === "import") {
          S[o].rows = seed.slice();
          load(o, "loaded");
          setTimeout(function () {
            toast("5 leads imported");
          }, 1300);
        }
        if (a === "clear") {
          S[o].rows.length || (S[o].rows = seed.slice());
          S[o].st = "loaded";
          render(o);
        }
        if (a === "toast") toast("Support ticket opened");
      });
      var g = document.getElementById("thm");
      g.querySelectorAll("button").forEach(function (b) {
        b.onclick = function () {
          g.querySelectorAll("button").forEach(function (x) {
            x.classList.remove("on");
          });
          b.classList.add("on");
          document.documentElement.dataset.theme = b.dataset.v;
        };
      });
    </script>
  </body>
</html>
