name: CI

# Runs on every pull request. Pushes to dev / stage / main run the same checks through
# deploy.yml (which calls this workflow), so they are not triggered twice.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://compass:compass@localhost:5432/compass
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
