name: CI

# Runs on every pull request. Pushes to dev / stage / main run the same checks through
# deploy.yml (which calls this workflow), so they are not triggered twice.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

env:
  DATABASE_URL: postgresql://compass:compass@localhost:5432/compass

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Integration tests (`*.int.test.ts`) run against a real database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests, with the coverage floor on `src/modules/**/service.ts` (vitest.config.ts).
      - run: pnpm test:coverage
      - run: pnpm db:deploy
      - run: pnpm test:int
      - run: pnpm build

  # End-to-end tests run on every pull request, not nightly: a UI ticket ships with its spec.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The app validates its environment at runtime; the example values are enough for tests.
      - run: grep -vE '^\s*(#|$)' .env.example >> "$GITHUB_ENV"
      - run: pnpm db:deploy
      # Specs sign in as the seeded admin (E0-10).
      - run: pnpm db:seed
      - run: pnpm build
      # The standalone server does not include static assets; copy them the way the Dockerfile does.
      - run: cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
